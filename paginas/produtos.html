<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Urban Wear
  </title>
  <link href="../css/style.css" rel="stylesheet"/>
  <meta content="Loja virtual Urban Wear" name="description"/>
 </head>
 <body>
  <header class="header">
   <div class="container header-inner">
    <a class="logo" href="../index.html">
     URBAN WEAR
    </a>
    <nav class="nav" id="nav">
     <a href="../index.html">
      Início
     </a>
     <a href="../paginas/produtos.html">
      Loja
     </a>
     <a href="../paginas/produtos.html?categoria=Polos">
      Polos
     </a>
     <a href="../paginas/produtos.html?categoria=Moletons">
      Moletons
     </a>
     <a href="../paginas/produtos.html?categoria=Calças">
      Calças
     </a>
     <a href="../paginas/produtos.html?categoria=Jorts">
      Jorts
     </a>
    </nav>
    <div class="header-actions">
     <a aria-label="Minha conta" class="icon-btn" href="../paginas/login.html">
      👤
     </a>
     <a aria-label="Carrinho" class="icon-btn" href="../paginas/carrinho.html">
      🛒
      <span class="badge" id="cartCount">
       0
      </span>
     </a>
     <button aria-label="Abrir menu" class="icon-btn mobile-menu" id="menuBtn">
      ☰
     </button>
    </div>
   </div>
  </header>
  <main class="section">
   <div class="container">
    <div class="section-head">
     <div>
      <p class="eyebrow">
       URBAN WEAR
      </p>
      <h1>
       Loja
      </h1>
      <p class="muted" id="resultCount">
      </p>
     </div>
    </div>
    <div class="filters">
     <input class="input" id="search" placeholder="Buscar produtos..."/>
     <select class="select" id="category">
      <option value="">
       Todas as categorias
      </option>
     </select>
     <select class="select" id="sort">
      <option value="relevance">
       Mais relevantes
      </option>
      <option value="low">
       Menor preço
      </option>
      <option value="high">
       Maior preço
      </option>
     </select>
     <select class="select" id="size">
      <option value="">
       Todos os tamanhos
      </option>
      <option>
       P
      </option>
      <option>
       M
      </option>
      <option>
       G
      </option>
      <option>
       GG
      </option>
      <option>
       XG
      </option>
     </select>
    </div>
    <div class="products-grid" id="catalog">
    </div>
   </div>
  </main>
  <footer class="footer">
   <div class="container footer-grid">
    <div>
     <h2>
      URBAN WEAR
     </h2>
     <p class="muted">
      Moda urbana, identidade e atitude.
     </p>
    </div>
    <div>
     <b>
      Loja
     </b>
     <p>
      <a href="../paginas/produtos.html">
       Produtos
      </a>
     </p>
     <p>
      <a href="../paginas/carrinho.html">
       Carrinho
      </a>
     </p>
     <p>
      <a href="../paginas/login.html">
       Minha conta
      </a>
     </p>
    </div>
    <div>
     <b>
      Ajuda
     </b>
     <p>
      <a href="../paginas/localizacao.html">
       Localização
      </a>
     </p>
     <p>
      Trocas e devoluções
     </p>
     <p>
      Pagamento seguro
     </p>
    </div>
    <div>
     <b>
      Acessibilidade
     </b>
     <p>
      Fonte ampliada
     </p>
     <p>
      Alto contraste
     </p>
    </div>
   </div>
  </footer>
  <div class="access">
   <div class="access-panel" id="accessPanel">
    <b>
     Acessibilidade
    </b>
    <button onclick="changeFont(1)">
     Aumentar fonte
    </button>
    <button onclick="changeFont(-1)">
     Diminuir fonte
    </button>
    <button onclick="toggleContrast()">
     Alto contraste
    </button>
   </div>
   <button aria-label="Acessibilidade" id="accessBtn">
    ♿
   </button>
  </div>
  <script src="../js/produtos.js">
  </script>
  <script src="../js/app.js">
  </script>
 </body>
</html>
